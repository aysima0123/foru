<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For U</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #0d0d0d;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.love-question {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 2;
}

h1 {
    font-size: 34px;
    font-weight: 400;
    margin-bottom: 12px;
}

h2 {
    font-size: 22px;
    font-weight: 300;
    margin-bottom: 35px;
}

.buttons {
    display: flex;
    gap: 20px;
    position: relative;
    min-height: 60px;
}

button {
    padding: 13px 35px;
    border-radius: 30px;
    border: 1px solid #e88aa8;
    background: transparent;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

#aysima:hover {
    background: #e88aa8;
    color: #111;
}

#ugur {
    position: relative;
}

#answer {
    margin-top: 30px;
    color: #e88aa8;
    font-size: 19px;
}

.hearts {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.heart {
    position: absolute;
    bottom: -30px;
    width: 14px;
    height: 14px;
    background: #e88aa8;
    transform: rotate(45deg);
    opacity: 0.25;
    animation: float 8s linear infinite;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    background: #e88aa8;
    border-radius: 50%;
}

.heart::before {
    left: -7px;
}

.heart::after {
    top: -7px;
}

@keyframes float {
    0% {
        transform: translateY(0) rotate(45deg);
        opacity: 0;
    }

    15% {
        opacity: 0.25;
    }

    85% {
        opacity: 0.25;
    }

    100% {
        transform: translateY(-110vh) rotate(45deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="love-question">

    <h1>For U</h1>

    <h2>Sence birbirimizi kim daha çok seviyor?</h2>

    <div class="buttons">
        <button id="aysima">Aysima</button>
        <button id="ugur">Uğur</button>
    </div>

    <p id="answer"></p>

</div>

<div class="hearts"></div>

<script>

const ugur = document.getElementById("ugur");
const aysima = document.getElementById("aysima");
const answer = document.getElementById("answer");

ugur.addEventListener("mouseenter", function() {

    const x = Math.random() * 300 - 150;
    const y = Math.random() * 180 - 90;

    ugur.style.transform =
        "translate(" + x + "px, " + y + "px)";
});

aysima.addEventListener("click", function() {

    answer.textContent = "Doğru cevap. Aysima.";

});

for (let i = 0; i < 25; i++) {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.style.left = Math.random() * 100 + "%";

    heart.style.animationDelay =
        Math.random() * 8 + "s";

    heart.style.animationDuration =
        6 + Math.random() * 6 + "s";

    document.querySelector(".hearts").appendChild(heart);
}

</script>

</body>
</html>
